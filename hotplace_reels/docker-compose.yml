services:
  app:
    build: .
    container_name: hotplace_reels_app
    volumes:
      - ./data_storage:/app/data_storage
      - ./logs:/app/logs
      - .env:/app/.env
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    restart: always

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: hotplace_reels_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
    volumes:
      - n8n_data:/home/node/.n8n
    restart: always

volumes:
  n8n_data:
