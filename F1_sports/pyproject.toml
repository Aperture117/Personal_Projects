[project]
name = "f1-ai-race-strategist"
version = "0.1.0"
description = "Production-quality AI-powered Formula 1 race intelligence platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastf1>=3.3.0",
    "requests>=2.31.0",
    "xgboost>=2.0.3",
    "lightgbm>=4.3.0",
    "scikit-learn>=1.4.1.post1",
    "pandas>=2.2.1",
    "pyarrow>=15.0.0",
    "fastparquet>=2024.2.0",
    "apscheduler>=3.10.4",
    "python-dotenv>=1.0.1",
    "ollama>=0.1.7",
    "pydantic>=2.6.3",
    "streamlit>=1.32.2",
    "torch>=2.2.0",
    "scipy>=1.12.0",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.3.0",
]
